<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생맞춤통합지원 업무 도우미</title>
<style>
  :root {
    --primary: #2457a7;
    --primary-light: #e8f0fb;
    --danger: #c0392b;
    --warn: #b45309;
    --ok: #1e7e50;
    --ink: #23303f;
    --muted: #6b7787;
    --line: #d9dfe7;
    --bg: #f2f4f7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 14px; color: var(--ink); background: var(--bg);
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
  header.top { padding: 18px 0 0; }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title-row h1 { font-size: 20px; margin: 0; color: var(--primary); }
  .title-row .school { color: var(--muted); font-size: 13px; }
  .title-row .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 2px solid var(--primary); flex-wrap: wrap; }
  .tabs button {
    border: 1px solid var(--line); border-bottom: none; background: #e9edf2; color: var(--ink);
    padding: 8px 14px; cursor: pointer; font-size: 14px; border-radius: 6px 6px 0 0; font-family: inherit;
  }
  .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
  .banner {
    margin: 12px 0 0; padding: 10px 14px; background: #fff8e6; border: 1px solid #e6cf8e; border-radius: 8px;
    font-size: 13px; color: #6b5312; display: flex; gap: 10px; align-items: flex-start;
  }
  .banner .x { margin-left: auto; cursor: pointer; border: none; background: none; font-size: 15px; color: #6b5312; }
  main { margin-top: 16px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--primary); border-radius: 8px; padding: 12px 14px; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stat-card.red { border-left-color: var(--danger); } .stat-card.red .num { color: var(--danger); }
  .stat-card.amber { border-left-color: #d97706; } .stat-card.amber .num { color: var(--warn); }
  .stat-card.green { border-left-color: var(--ok); } .stat-card.green .num { color: var(--ok); }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; font-size: 13.5px; }
  th { background: #eef2f7; font-weight: 700; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--primary-light); }
  .table-wrap { overflow-x: auto; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }
  .pill.level-관심 { background: #eef6ee; color: var(--ok); border-color: #bcd9c6; }
  .pill.level-지원필요 { background: #fdf3e3; color: var(--warn); border-color: #ecd3a4; }
  .pill.level-집중지원 { background: #fdecea; color: var(--danger); border-color: #efb9b2; }
  .pill.stage { background: var(--primary-light); color: var(--primary); border-color: #b9cdea; }
  .pill.stage-종결 { background: #eceff3; color: var(--muted); border-color: var(--line); }
  .pill.area { background: #f1eefa; color: #5b4a9e; border-color: #cfc4ec; margin: 1px 2px 1px 0; }
  .stage-flow { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .stage-flow .step { padding: 4px 10px; border-radius: 6px; background: #eceff3; color: var(--muted); font-size: 12.5px; }
  .stage-flow .step.done { background: #dbe7f8; color: var(--primary); }
  .stage-flow .step.now { background: var(--primary); color: #fff; font-weight: 700; }
  .stage-flow .arr { color: var(--muted); font-size: 12px; }
  button.btn {
    font-family: inherit; font-size: 13.5px; padding: 7px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--primary); background: var(--primary); color: #fff;
  }
  button.btn.sub { background: #fff; color: var(--primary); }
  button.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  button.btn.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button.btn.sm { font-size: 12.5px; padding: 4px 9px; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  label.fld { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    font-family: inherit; font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    width: 100%; background: #fff; color: var(--ink);
  }
  textarea { min-height: 74px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #b9cdea; border-color: var(--primary); }
  .grid { display: grid; gap: 10px; }
  .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1fr 1fr 1fr; } .g4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 720px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
  .checks { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .checks label { font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .alert-box { background: #fdecea; border: 1px solid #efb9b2; color: var(--danger); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 13.5px; }
  .info-box { background: var(--primary-light); border: 1px solid #b9cdea; border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 13.5px; }
  .empty { text-align: center; padding: 46px 20px; color: var(--muted); }
  .empty h2 { color: var(--ink); }
  .chk-area { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .chk-area .hd { background: #eef2f7; padding: 8px 12px; font-weight: 700; font-size: 13.5px; }
  .chk-area .bd { padding: 6px 12px; }
  .chk-item { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px dashed #e7ebf0; }
  .chk-item:last-child { border-bottom: none; }
  .chk-item input { margin-top: 2px; }
  .chk-item label { cursor: pointer; }
  .chk-item .tag { color: var(--danger); font-size: 11.5px; font-weight: 700; margin-left: 6px; }
  .overdue { color: var(--danger); font-weight: 700; }
  .soon { color: var(--warn); font-weight: 700; }
  .footer-note { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
  .log-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .log-item .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .log-item .content { white-space: pre-wrap; }
  .log-item .next { margin-top: 6px; font-size: 12.5px; color: var(--warn); }
  .mono-block { background: #f6f8fa; border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-size: 12.5px; max-height: 340px; overflow: auto; }

  /* 인쇄 */
  #print-area { display: none; }
  @media print {
    body { background: #fff; }
    #app { display: none; }
    #print-area { display: block; font-size: 12.5pt; }
    #print-area table { width: 100%; }
    #print-area th, #print-area td { border: 1px solid #333; padding: 6px 8px; }
    #print-area h1 { font-size: 17pt; text-align: center; margin: 4px 0 18px; }
    #print-area .doc-foot { margin-top: 26px; font-size: 9.5pt; color: #555; border-top: 1px solid #999; padding-top: 6px; }
    #print-area .sign-table td { height: 52px; text-align: center; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title-row">
      <h1>학생맞춤통합지원 업무 도우미</h1>
      <span class="school" id="hd-school"></span>
      <span class="spacer"></span>
      <label style="font-size:12.5px; display:inline-flex; align-items:center; gap:5px; cursor:pointer;">
        <input type="checkbox" id="hd-mask" onchange="toggleMask(this.checked)"> 이름 가리기
      </label>
      <button class="btn sub sm" onclick="downloadBackup()">데이터 백업</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-v="dashboard" onclick="nav('dashboard')">대시보드</button>
      <button data-v="students" onclick="nav('students')">학생 사례</button>
      <button data-v="checklist" onclick="nav('checklist')">발굴 체크리스트</button>
      <button data-v="meetings" onclick="nav('meetings')">지원팀 협의회</button>
      <button data-v="resources" onclick="nav('resources')">자원 연계</button>
      <button data-v="stats" onclick="nav('stats')">통계·보고</button>
      <button data-v="data" onclick="nav('data')">데이터·설정</button>
    </nav>
  </header>
  <div class="banner" id="privacy-banner">
    <span>🔒</span>
    <span>모든 데이터는 <b>이 컴퓨터의 브라우저 안에만</b> 저장되며 외부로 전송되지 않습니다.
    학생 개인정보가 포함되므로 <b>공용 PC 사용을 피하고</b>, 화면 잠금과 주기적 백업(백업 파일도 안전한 곳에 보관)을 생활화해 주세요.
    브라우저 데이터 삭제 시 기록이 사라질 수 있으니 <b>「데이터 백업」 버튼</b>을 자주 눌러 주세요.</span>
    <button class="x" onclick="closeBanner()" title="닫기">✕</button>
  </div>
  <main id="view"></main>
  <div class="footer-note">학생맞춤통합지원 업무 도우미 · 오프라인 단독 실행 · 마지막 저장: <span id="saved-at">-</span></div>
</div>
<div id="print-area"></div>

<script>
'use strict';

/* ===================== 상수 ===================== */
const AREAS = ['학업·진로', '심리·정서', '대인관계·학교폭력', '출결·학업중단', '가정·환경', '경제', '건강', '기타'];
const LEVELS = ['관심', '지원필요', '집중지원'];
const STAGES = ['발굴', '진단·파악', '계획수립', '지원실행', '모니터링', '종결'];
const LOG_TYPES = ['학생상담', '보호자상담·가정연락', '교사협의', '지원팀회의', '교내지원(프로그램·물품 등)', '외부기관 연계', '모니터링', '기타'];
const REFERRALS = ['담임교사 관찰', '교과교사 의뢰', '체크리스트(스크리닝)', '학생 본인 요청', '보호자 요청', '또래·친구 알림', '외부기관 통보', '기타'];

const CHECKLIST = [
  { area: '출결·학업중단', items: [
    { id: 'AT1', text: '최근 1개월 내 무단결석·지각·조퇴가 잦다' },

    { id: 'AT4', text: '등교는 하지만 수업 이탈(무단 외출, 보건실 장기 체류 등)이 잦다' },
  ]},
  { area: '학업·진로', items: [
    { id: 'ST1', text: '기초학력이 부족하여 수업 내용을 따라가기 어려워한다' },
    { id: 'ST2', text: '최근 성적이나 수업 참여도가 눈에 띄게 떨어졌다' },
    { id: 'ST3', text: '과제 미제출·수행평가 포기가 반복된다' },
    { id: 'ST4', text: '진로 계획이 전혀 없거나 심한 막막함을 호소한다' },
    { id: 'ST5', text: '자격증 취득·현장실습 등 필수 과정 참여를 회피한다' },
  ]},
  { area: '심리·정서', items: [
    { id: 'EM1', text: '무기력하거나 우울해 보이는 모습이 2주 이상 지속된다' },
    { id: 'EM2', text: '불안·긴장이 심하거나 사소한 일에 과민하게 반응한다' },
    { id: 'EM3', text: '감정 기복이 크고 분노 조절이 어려워 보인다' },
    { id: 'EM4', text: '자해 흔적이 있거나 죽음·자살을 언급한 적이 있다', alert: '자살·자해 위험 징후입니다. 체크리스트 결과와 관계없이 즉시 관리자·전문상담(교)사에게 알리고, 위기 상담(자살예방 상담전화 109 등)과 보호자 연락 등 학교 위기 대응 절차를 우선 진행하세요.' },
    { id: 'EM5', text: '수면 문제(불면·과다수면)나 식사 문제가 관찰된다' },

  { area: '대인관계·학교폭력', items: [

    { id: 'RE3', text: '또래·교사와의 갈등이 반복된다' },

  ]},
  { area: '가정·환경', items: [

  ]},
  { area: '건강', items: [

const DEFAULT_RESOURCES = [
  { kind: '교내', name: '담임·교과 교사 협의', category: '전체', contact: '', note: '수업·생활 관찰 정보 공유, 1차 지지자원' },

  { kind: '교내', name: '보건교사(보건실)', category: '건강', contact: '', note: '건강 상태 확인, 의료기관 안내' },
  { kind: '교내', name: '진로전담교사', category: '학업·진로', contact: '', note: '진로상담, 취업·현장실습 관련 지원' },

/* ===================== 상태 ===================== */
const STORE_KEY = 'smtj_helper_v1';

function defaultState() {
  return {
    version: 1,
    seq: 1,
    settings: { schoolName: '', teacherName: '', maskNames: false, bannerClosed: false },
    students: [],
    meetings: [],
    resources: DEFAULT_RESOURCES.map(r => Object.assign({ id: uid() }, r)),
  };
}

function uid() {
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.students)) return defaultState();
    d.settings = Object.assign({ schoolName: '', teacherName: '', maskNames: false, bannerClosed: false }, d.settings || {});
    d.meetings = d.meetings || [];
    d.resources = d.resources || [];
    d.seq = d.seq || (d.students.length + 1);
    return d;
  } catch (e) { return defaultState(); }
}

let state = load();
let ui = {
  view: 'dashboard', studentId: null, studentTab: 'info', editingStudent: false,
  editingMeeting: false, meetingId: null, editingResource: false, resourceId: null,
  search: '', filterStage: '', filterArea: '', filterLevel: '',
  resKind: '', resSearch: '',
  scrStudent: '', scrChecked: {}, scrMemo: '', scrDate: '',
  logEditId: null,
};
let lastStatsMd = '';
let lastStatsTsv = '';

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    const el = document.getElementById('saved-at');
    if (el) el.textContent = new Date().toLocaleString('ko-KR');
  } catch (e) {
    alert('저장에 실패했습니다. 브라우저 저장 공간이 부족할 수 있습니다.\n데이터 백업 후 오래된 기록을 정리해 주세요.\n' + e);
  }
}

/* ===================== 유틸 ===================== */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function schoolYearStart() {
  const d = new Date();
  const y = d.getMonth() + 1 >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return y + '-03-01';
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function maskName(name) {
  if (!name) return '';
  if (name.length <= 1) return name;
  if (name.length === 2) return name[0] + '○';
  return name[0] + '○'.repeat(name.length - 2) + name[name.length - 1];
}
function dispName(s) {
  const n = s.name || '(이름 미입력)';
  return state.settings.maskNames && s.name ? maskName(s.name) : n;
}
function studentLabel(s) {
  const cls = [s.grade && s.grade + '학년', s.klass && s.klass + '반', s.num && s.num + '번'].filter(Boolean).join(' ');
  return '[' + s.code + '] ' + dispName(s) + (cls ? ' (' + cls + ')' : '');
}
function byId(arr, id) { return arr.find(x => x.id === id); }
function getStudent(id) { return byId(state.students, id); }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function checkedVals(name) {
  return Array.prototype.slice.call(document.querySelectorAll('input[name="' + name + '"]:checked')).map(el => el.value);
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert('복사되었습니다.'), () => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('복사되었습니다.'); }
  catch (e) { alert('복사에 실패했습니다. 아래 내용을 직접 선택해 복사해 주세요.'); }
  ta.remove();
}
function tsvCell(v) {
  return String(v == null ? '' : v).replace(/\t/g, ' ').replace(/\r?\n/g, ' / ');
}
function toTsv(rows) {
  return '\uFEFF' + rows.map(r => r.map(tsvCell).join('\t')).join('\r\n');
}
function optionList(arr, selected) {
  return arr.map(o => '<option value="' + esc(o) + '"' + (o === selected ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
}
function areaPills(areas) {
  return (areas || []).map(a => '<span class="pill area">' + esc(a) + '</span>').join('');
}
function latestLogDate(s) {
  let d = s.openedAt || '';
  (s.logs || []).forEach(l => { if (l.date > d) d = l.date; });
  return d;
}

/* ===================== 대시보드 ===================== */
function pendingActions() {
  const list = [];
  const limit = addDays(today(), 7);
  state.students.forEach(s => {
    if (s.stage === '종결') return;
    (s.logs || []).forEach(l => {
      if (l.nextDate && l.nextDate <= limit) {
        list.push({ student: s, log: l });
      }
    });
  });
  list.sort((a, b) => a.log.nextDate < b.log.nextDate ? -1 : 1);
  return list;
}
function staleStudents() {
  const cut = addDays(today(), -30);
  return state.students.filter(s => s.stage !== '종결' && latestLogDate(s) < cut);
}

function renderDashboard() {
  const active = state.students.filter(s => s.stage !== '종결');
  if (state.students.length === 0) {
    return '<div class="card empty">' +
      '<h2>학생맞춤통합지원 사례관리를 시작해 보세요</h2>' +

      '모든 데이터는 이 컴퓨터에만 저장됩니다.</p>' +
      '<div class="btn-row" style="justify-content:center;">' +
      '<button class="btn" onclick="nav(\'students\'); showStudentForm(null)">첫 학생 사례 등록</button>' +
      '<button class="btn sub" onclick="nav(\'checklist\')">체크리스트로 발굴 시작</button>' +
      '<button class="btn ghost" onclick="loadSampleData()">가상 예시 데이터로 둘러보기</button>' +
      '</div></div>';
  }
  const intensive = active.filter(s => s.level === '집중지원');
  const acts = pendingActions();
  const overdue = acts.filter(a => a.log.nextDate < today());
  const stale = staleStudents();
  const noConsent = active.filter(s => !(s.consent && s.consent.collected));

  let h = '<div class="cards">' +
    '<div class="stat-card"><div class="num">' + active.length + '</div><div class="lbl">진행 중 사례</div></div>' +
    '<div class="stat-card red"><div class="num">' + intensive.length + '</div><div class="lbl">집중지원 사례</div></div>' +
    '<div class="stat-card amber"><div class="num">' + acts.length + '</div><div class="lbl">7일 내 조치 예정(지연 ' + overdue.length + ')</div></div>' +
    '<div class="stat-card amber"><div class="num">' + stale.length + '</div><div class="lbl">30일 이상 기록 없음</div></div>' +
    '<div class="stat-card ' + (noConsent.length ? 'red' : 'green') + '"><div class="num">' + noConsent.length + '</div><div class="lbl">개인정보 동의 미확인</div></div>' +
    '</div>';

  h += '<h2>단계별 현황</h2><div class="card"><div class="stage-flow">';
  STAGES.forEach((st, i) => {
    const n = state.students.filter(s => s.stage === st).length;
    h += '<span class="step' + (n > 0 ? ' done' : '') + '">' + esc(st) + ' <b>' + n + '</b></span>';
    if (i < STAGES.length - 1) h += '<span class="arr">▶</span>';
  });
  h += '</div></div>';

  h += '<h2>다가오는 조치 (오늘부터 7일, 지연 포함)</h2>';
  if (acts.length === 0) {
    h += '<div class="card muted">예정된 조치가 없습니다. 지원 기록을 남길 때 「다음 조치 예정일」을 입력하면 여기에 표시됩니다.</div>';
  } else {
    h += '<div class="card table-wrap"><table><tr><th>예정일</th><th>학생</th><th>다음 조치</th><th>최근 기록</th></tr>';
    acts.slice(0, 15).forEach(a => {
      const cls = a.log.nextDate < today() ? 'overdue' : (a.log.nextDate <= addDays(today(), 2) ? 'soon' : '');
      h += '<tr class="clickable" onclick="openStudent(\'' + a.student.id + '\')">' +
        '<td class="' + cls + '">' + esc(a.log.nextDate) + (a.log.nextDate < today() ? ' (지연)' : '') + '</td>' +
        '<td>' + esc(studentLabel(a.student)) + '</td>' +
        '<td>' + esc(a.log.nextAction || '(내용 미입력)') + '</td>' +
        '<td class="muted">' + esc(a.log.date) + ' ' + esc(a.log.type) + '</td></tr>';
    });
    h += '</table><div class="muted" style="margin-top:6px;">조치를 마치면 해당 기록을 열어 예정일을 지우거나, 새 기록을 남기고 예정일을 갱신해 주세요.</div></div>';
  }

  if (stale.length > 0) {
    h += '<h2>오래 들여다보지 못한 사례</h2><div class="card table-wrap"><table><tr><th>학생</th><th>단계</th><th>마지막 기록일</th></tr>';
    stale.forEach(s => {
      h += '<tr class="clickable" onclick="openStudent(\'' + s.id + '\')"><td>' + esc(studentLabel(s)) + '</td><td>' + esc(s.stage) + '</td><td class="overdue">' + esc(latestLogDate(s) || '-') + '</td></tr>';
    });
    h += '</table></div>';
  }
  return h;
}
function openStudent(id) {
  ui.view = 'students';
  ui.studentId = id;
  ui.studentTab = 'info';
  ui.editingStudent = false;

/* ===================== 학생 사례 ===================== */
function renderStudents() {
  if (ui.editingStudent) return renderStudentForm(ui.studentId ? getStudent(ui.studentId) : null);
  if (ui.studentId) {
    const s = getStudent(ui.studentId);
    if (s) return renderStudentDetail(s);
    ui.studentId = null;
  }
  return renderStudentList();
}

function studentMatches(s) {
  if (ui.filterStage && s.stage !== ui.filterStage) return false;
  if (ui.filterLevel && s.level !== ui.filterLevel) return false;
  if (ui.filterArea && (s.areas || []).indexOf(ui.filterArea) < 0) return false;
  if (ui.search) {
    const q = ui.search.toLowerCase();
    const hay = [s.code, s.name, s.grade, s.klass, s.num, s.homeroom, s.manager, s.summary].join(' ').toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  return true;
}

function studentRowsHtml() {
  const list = state.students.filter(studentMatches);
  list.sort((a, b) => (a.stage === '종결') - (b.stage === '종결') || (a.code < b.code ? -1 : 1));
  if (list.length === 0) return '<tr><td colspan="7" class="muted">조건에 맞는 학생이 없습니다.</td></tr>';
  return list.map(s => {
    return '<tr class="clickable" onclick="openStudent(\'' + s.id + '\')">' +
      '<td>' + esc(s.code) + '</td>' +
      '<td>' + esc(dispName(s)) + '</td>' +
      '<td>' + esc([s.grade, s.klass, s.num].filter(Boolean).join('-')) + '</td>' +
      '<td><span class="pill level-' + esc(s.level) + '">' + esc(s.level) + '</span></td>' +
      '<td><span class="pill stage' + (s.stage === '종결' ? ' stage-종결' : '') + '">' + esc(s.stage) + '</span></td>' +
      '<td>' + areaPills(s.areas) + '</td>' +
      '<td class="muted">' + esc(latestLogDate(s) || '-') + '</td></tr>';
  }).join('');
}

    '<div><label class="fld">번호</label><input type="text" id="f-num" value="' + esc(d.num) + '"></div></div>' +
    '<div class="grid g4" style="margin-top:10px;">' +
    '<div><label class="fld">담임교사</label><input type="text" id="f-homeroom" value="' + esc(d.homeroom) + '"></div>' +
    '<div><label class="fld">담당자(사례관리)</label><input type="text" id="f-manager" value="' + esc(d.manager) + '"></div>' +

  h += '<h3>개인정보 수집·이용 동의</h3><div class="grid g3">' +
    '<div><label class="fld">동의 확보 여부</label><label style="font-size:13.5px;"><input type="checkbox" id="f-consent"' + (d.consent && d.consent.collected ? ' checked' : '') + '> 학생·보호자 동의 확보</label></div>' +
    '<div><label class="fld">동의일</label><input type="date" id="f-consent-date" value="' + esc(d.consent ? d.consent.date : '') + '"></div>' +
    '<div><label class="fld">비고(동의 방식 등)</label><input type="text" id="f-consent-note" value="' + esc(d.consent ? d.consent.note : '') + '"></div></div>' +
    '<div class="muted" style="margin-top:6px;">동의서 서식은 저장소의 templates 폴더를 참고하세요. 법령상 처리 근거·동의 요건은 학교 개인정보 보호 담당자와 확인해 주세요.</div>';
  h += '<div class="btn-row" style="margin-top:14px;">' +
    '<button class="btn" onclick="saveStudent()">' + (isNew ? '등록' : '저장') + '</button>' +
    '<button class="btn ghost" onclick="cancelStudentForm()">취소</button></div>';

  return h;
}

function saveStudent() {
  const isNew = !ui.studentId;
  const s = isNew ? {
    id: uid(),
    code: new Date().getFullYear() + '-' + String(state.seq).padStart(3, '0'),
    logs: [], screenings: [],
    plan: { goals: '', inSchool: '', external: '', period: '', reviewDate: '' },
    closedAt: '',
  } : getStudent(ui.studentId);
  if (!s) return;
  s.name = val('f-name');
  s.grade = val('f-grade');
  s.klass = val('f-klass');
  s.num = val('f-num');
  s.homeroom = val('f-homeroom');
  s.manager = val('f-manager');
  s.referralPath = val('f-referral');
  s.openedAt = val('f-opened') || today();
  s.areas = checkedVals('f-areas');
  s.level = val('f-level');
  const newStage = val('f-stage');
  applyStage(s, newStage);
  s.summary = val('f-summary');
  s.consent = {
    collected: document.getElementById('f-consent').checked,
    date: val('f-consent-date'),
    note: val('f-consent-note'),
  };
  if (isNew) {
    state.seq += 1;
    state.students.push(s);
    ui.studentId = s.id;
  }
  ui.editingStudent = false;
  save();
  render();
}

function applyStage(s, newStage) {
  if (STAGES.indexOf(newStage) < 0) return;
  if (newStage === '종결' && s.stage !== '종결') s.closedAt = today();
  if (newStage !== '종결') s.closedAt = '';
  s.stage = newStage;
}

function deleteStudent() {
  const s = getStudent(ui.studentId);
  if (!s) return;
  if (!confirm('[' + s.code + '] 사례를 삭제합니다. 기록·스크리닝 결과가 모두 지워지며 되돌릴 수 없습니다.\n계속할까요?')) return;
  if (!confirm('정말 삭제할까요? 종결 처리(기록 보존)로 충분하다면 취소를 누르세요.')) return;
  state.students = state.students.filter(x => x.id !== s.id);
  ui.studentId = null;
  save();
  render();
}

function backToList() { ui.studentId = null; ui.editingStudent = false; render(); }
function setStudentTab(t) { ui.studentTab = t; ui.logEditId = null; render(); }
function editStudent() { ui.editingStudent = true; render(); }

function setStageSel(v) {
  const s = getStudent(ui.studentId);
  if (!s) return;
  applyStage(s, v);
  save();
  render();
}
function advanceStage() {
  const s = getStudent(ui.studentId);
  if (!s) return;
  const i = STAGES.indexOf(s.stage);
  if (i < 0 || i >= STAGES.length - 1) return;
  applyStage(s, STAGES[i + 1]);
  save();
  render();
}

function renderStudentDetail(s) {
  let h = '<div class="btn-row"><button class="btn ghost sm" onclick="backToList()">← 목록</button>' +
    '<button class="btn sub sm" onclick="editStudent()">정보 수정</button>' +
    '<button class="btn sub sm" onclick="printPlan(\'' + s.id + '\')">지원계획서 인쇄</button>' +
    '<button class="btn sub sm" onclick="printCaseSummary(\'' + s.id + '\')">사례 요약 인쇄</button>' +
    '<button class="btn danger sm" onclick="deleteStudent()">삭제</button></div>';

  h += '<div class="card"><div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
    '<b style="font-size:16px;">' + esc(studentLabel(s)) + '</b>' +
    '<span class="pill level-' + esc(s.level) + '">' + esc(s.level) + '</span>' + areaPills(s.areas) +
    '<span class="spacer" style="flex:1;"></span>' +
    '<label class="fld" style="margin:0;">단계</label>' +
    '<select style="width:auto;" onchange="setStageSel(this.value)">' + optionList(STAGES, s.stage) + '</select>' +
    (s.stage !== '종결' ? '<button class="btn sm" onclick="advanceStage()">다음 단계로 ▶</button>' : '') +
    '</div>';
  h += '<div class="stage-flow" style="margin-top:10px;">';
  const cur = STAGES.indexOf(s.stage);
  STAGES.forEach((st, i) => {
    h += '<span class="step' + (i < cur ? ' done' : i === cur ? ' now' : '') + '">' + esc(st) + '</span>';
    if (i < STAGES.length - 1) h += '<span class="arr">▶</span>';
  });
  h += '</div>';
  if (!(s.consent && s.consent.collected)) {
    h += '<div class="alert-box">개인정보 수집·이용 동의가 아직 확인되지 않았습니다. 정보 수정 화면에서 동의 확보 여부를 기록해 주세요. (동의서 서식: templates 폴더)</div>';
  }
  h += '</div>';

  const tabs = [['info', '기본 정보'], ['plan', '지원 계획'], ['logs', '지원 기록 (' + (s.logs || []).length + ')'], ['scr', '스크리닝 (' + (s.screenings || []).length + ')']];
  h += '<div class="tabs" style="border-bottom-color: var(--line);">' + tabs.map(t =>
    '<button class="' + (ui.studentTab === t[0] ? 'active' : '') + '" onclick="setStudentTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>';

  if (ui.studentTab === 'info') h += renderStudentInfo(s);
  else if (ui.studentTab === 'plan') h += renderStudentPlan(s);
  else if (ui.studentTab === 'logs') h += renderStudentLogs(s);
  else if (ui.studentTab === 'scr') h += renderStudentScreenings(s);
  return h;
}

  return '<div class="card"><div class="table-wrap"><table>' +
    '<tr><th style="width:130px;">관리번호</th><td>' + esc(s.code) + '</td><th style="width:130px;">등록일</th><td>' + esc(s.openedAt) + '</td></tr>' +

    '<div style="margin-top:10px;"><label class="fld">내용 (사실 위주로 간결하게. 민감한 정보는 필요한 만큼만)</label><textarea id="l-content">' + esc(d.content) + '</textarea></div>' +
    '<div class="grid g2" style="margin-top:10px;">' +
    '<div><label class="fld">다음 조치 예정일 (대시보드 알림에 사용)</label><input type="date" id="l-next-date" value="' + esc(d.nextDate) + '"></div>' +

    (editing ? '<button class="btn ghost" onclick="cancelLogEdit()">취소</button>' : '') +

  const logs = (s.logs || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);

  else {
    h += logs.map(l => '<div class="log-item">' +

function saveLog() {
  const s = getStudent(ui.studentId);
  if (!s) return;
  const content = val('l-content');
  if (!content) { alert('내용을 입력해 주세요.'); return; }
  const data = {
    date: val('l-date') || today(), type: val('l-type'), content: content,
    nextDate: val('l-next-date'), nextAction: val('l-next-action'), writer: val('l-writer'),
  };
  if (ui.logEditId) {
    const l = (s.logs || []).find(x => x.id === ui.logEditId);
    if (l) Object.assign(l, data);
    ui.logEditId = null;
  } else {
    s.logs = s.logs || [];
    s.logs.push(Object.assign({ id: uid() }, data));
  }
  save();
  render();
}
function editLog(id) { ui.logEditId = id; render(); }
function cancelLogEdit() { ui.logEditId = null; render(); }
function deleteLog(id) {
  const s = getStudent(ui.studentId);
  if (!s) return;
  if (!confirm('이 기록을 삭제할까요?')) return;
  s.logs = (s.logs || []).filter(l => l.id !== id);
  if (ui.logEditId === id) ui.logEditId = null;
  save();
  render();
}

function renderStudentScreenings(s) {
  const list = (s.screenings || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);
  let h = '<div class="card"><div class="btn-row" style="margin:0 0 8px;">' +
    '<button class="btn sub sm" onclick="goChecklistFor(\'' + s.id + '\')">이 학생으로 체크리스트 실시</button></div>';
  if (list.length === 0) h += '<div class="muted">실시한 체크리스트가 없습니다.</div>';
  else {
    h += '<div class="table-wrap"><table><tr><th>실시일</th><th>체크 문항 수</th><th>해당 영역</th><th>메모</th><th></th></tr>';

        '<td>' + areaPills(Object.keys(areas)) + '</td><td>' + esc(sc.memo || '') + '</td>' +

        '<button class="btn danger sm" onclick="deleteScreening(\'' + s.id + '\',\'' + sc.id + '\')">삭제</button></td></tr>';
    });
    h += '</table></div>';
  }
  h += '</div>';
  return h;
}
function deleteScreening(studentId, scrId) {
  const s = getStudent(studentId);
  if (!s) return;
  if (!confirm('이 스크리닝 결과를 삭제할까요?')) return;
  s.screenings = (s.screenings || []).filter(x => x.id !== scrId);
  save();
  render();
}
function goChecklistFor(studentId) {
  ui.view = 'checklist';
  ui.scrStudent = studentId;
  ui.scrChecked = {};
  ui.scrMemo = '';
  ui.scrDate = today();
  render();
}

/* ===================== 발굴 체크리스트 ===================== */
function screeningAreas(checkedIds) {
  const areas = {};
  (checkedIds || []).forEach(id => {
    const it = CHECK_INDEX[id];
    if (it) areas[it.area] = (areas[it.area] || 0) + 1;
  });
  return areas;
}

function renderChecklist() {
  const active = state.students.filter(s => s.stage !== '종결');
  let h = '<h2>위기 징후 발굴 체크리스트</h2>' +
    '<div class="info-box">담임·교과 교사의 일상 관찰을 바탕으로 해당하는 문항에 체크하세요. 문항 수가 많다고 반드시 위기인 것은 아니며, ' +
    '결과는 지원팀 협의의 <b>참고자료</b>입니다. 빨간 표시(즉시 대응) 문항은 체크 즉시 별도 절차 안내가 표시됩니다.' +
    '<br><span class="muted">※ 이 문항은 참고용 자체 서식입니다. 교육부·교육청 공식 진단도구가 배포된 경우 그것을 우선 사용하세요.</span></div>';

  h += '<div class="card"><div class="grid g3">' +
    '<div><label class="fld">대상 학생 (등록된 사례)</label><select id="scr-student" onchange="ui.scrStudent=this.value">' +
    '<option value="">(선택 안 함 — 결과 저장하려면 선택)</option>' +
    active.map(s => '<option value="' + s.id + '"' + (ui.scrStudent === s.id ? ' selected' : '') + '>' + esc(studentLabel(s)) + '</option>').join('') +
    '</select></div>' +
    '<div><label class="fld">실시일</label><input type="date" id="scr-date" value="' + esc(ui.scrDate || today()) + '" onchange="ui.scrDate=this.value"></div>' +
    '<div><label class="fld">미등록 학생이라면</label><div class="btn-row" style="margin:0;"><button class="btn sub sm" onclick="showStudentForm(null)">먼저 사례 등록</button></div></div>' +
    '</div></div>';

  h += CHECKLIST.map(g => {
    return '<div class="chk-area"><div class="hd">' + esc(g.area) + '</div><div class="bd">' +
      g.items.map(it => '<div class="chk-item">' +
        '<input type="checkbox" id="chk-' + it.id + '"' + (ui.scrChecked[it.id] ? ' checked' : '') + ' onchange="toggleCheck(\'' + it.id + '\', this.checked)">' +
        '<label for="chk-' + it.id + '">' + esc(it.text) + (it.alert ? '<span class="tag">⚠ 즉시 대응</span>' : '') + '</label>' +
        '</div>').join('') +
      '</div></div>';
  }).join('');

  h += '<div class="card"><label class="fld">메모 (관찰 근거, 참고 사항)</label>' +
    '<textarea id="scr-memo" oninput="ui.scrMemo=this.value">' + esc(ui.scrMemo) + '</textarea></div>';

    '<button class="btn ghost" onclick="resetScreening()">초기화</button></div>';

function toggleCheck(id, on) {
  if (on) ui.scrChecked[id] = true; else delete ui.scrChecked[id];
  const el = document.getElementById('scr-summary');
  if (el) el.innerHTML = checklistSummaryHtml();
}
function checklistSummaryHtml() {
  const ids = Object.keys(ui.scrChecked);
  const areas = screeningAreas(ids);
  const alerts = ids.map(id => CHECK_INDEX[id]).filter(it => it && it.alert);
  let h = '<div class="card"><h3 style="margin-top:0;">실시간 요약</h3>';

function renderStats() {
  const from = ui.statFrom || schoolYearStart();
  const to = ui.statTo || today();
  return '<h2>운영 실적 통계</h2>' +
    '<div class="card"><div class="grid g3">' +
    '<div><label class="fld">시작일</label><input type="date" id="st-from" value="' + esc(from) + '"></div>' +
    '<div><label class="fld">종료일</label><input type="date" id="st-to" value="' + esc(to) + '"></div>' +
    '<div style="display:flex; align-items:flex-end;"><button class="btn" onclick="runStats()">집계 실행</button></div></div>' +
    '<div class="muted" style="margin-top:6px;">기본 기간은 이번 학년도(3월 1일)부터 오늘까지입니다. 보고서에는 학생 이름 등 개인정보가 들어가지 않습니다.</div></div>' +
    '<div id="stats-result"></div>';
}
function computeStats(from, to) {
  const inRange = d => d && d >= from && d <= to;
  const managed = state.students.filter(s => s.openedAt <= to && (!s.closedAt || s.closedAt >= from));
  const opened = state.students.filter(s => inRange(s.openedAt));
  const closed = state.students.filter(s => inRange(s.closedAt));
  const activeAtEnd = state.students.filter(s => s.openedAt <= to && (!s.closedAt || s.closedAt > to));
  const areaCount = {};
  AREAS.forEach(a => areaCount[a] = 0);
  managed.forEach(s => (s.areas || []).forEach(a => { if (areaCount[a] != null) areaCount[a]++; else areaCount[a] = 1; }));
  const logType = {};
  LOG_TYPES.forEach(t => logType[t] = 0);
  let logTotal = 0;
  const servedIds = {};
  state.students.forEach(s => (s.logs || []).forEach(l => {
    if (inRange(l.date)) {
      logTotal++;
      servedIds[s.id] = true;
      if (logType[l.type] != null) logType[l.type]++; else logType[l.type] = (logType[l.type] || 0) + 1;
    }
  }));
  let scrCount = 0;
  state.students.forEach(s => (s.screenings || []).forEach(sc => { if (inRange(sc.date)) scrCount++; }));
  const meetCount = state.meetings.filter(m => inRange(m.date)).length;
  const levelCount = {};
  LEVELS.forEach(lv => levelCount[lv] = activeAtEnd.filter(s => s.level === lv).length);
  return { from, to, managed, opened, closed, activeAtEnd, areaCount, logType, logTotal, served: Object.keys(servedIds).length, scrCount, meetCount, levelCount };
}
function runStats() {
  const from = val('st-from') || schoolYearStart();
  const to = val('st-to') || today();
  ui.statFrom = from;
  ui.statTo = to;
  if (from > to) { alert('시작일이 종료일보다 늦습니다.'); return; }
  const st = computeStats(from, to);
  const school = state.settings.schoolName || '(학교명 미설정)';

  let md = '# 학생맞춤통합지원 운영 실적\n\n';
  md += '- 학교: ' + school + '\n- 집계 기간: ' + from + ' ~ ' + to + '\n- 작성일: ' + today() + (state.settings.teacherName ? '\n- 작성자: ' + state.settings.teacherName : '') + '\n\n';
  md += '## 1. 사례 현황\n\n| 구분 | 인원 |\n|---|---|\n';
  md += '| 기간 내 신규 발굴·등록 | ' + st.opened.length + ' |\n';
  md += '| 기간 내 종결 | ' + st.closed.length + ' |\n';
  md += '| 기간 말 기준 진행 중 | ' + st.activeAtEnd.length + ' |\n';
  md += '| 기간 중 관리 사례(연인원 아님) | ' + st.managed.length + ' |\n\n';
  md += '### 진행 중 사례의 위기 수준\n\n| 수준 | 인원 |\n|---|---|\n' + LEVELS.map(lv => '| ' + lv + ' | ' + st.levelCount[lv] + ' |').join('\n') + '\n\n';
  md += '## 2. 위기 영역별 현황 (관리 사례 기준, 중복 집계)\n\n| 영역 | 사례 수 |\n|---|---|\n';
  Object.keys(st.areaCount).forEach(a => { if (st.areaCount[a] > 0) md += '| ' + a + ' | ' + st.areaCount[a] + ' |\n'; });
  md += '\n## 3. 지원 활동 실적\n\n| 유형 | 건수 |\n|---|---|\n';
  Object.keys(st.logType).forEach(t => { if (st.logType[t] > 0) md += '| ' + t + ' | ' + st.logType[t] + ' |\n'; });
  md += '| **합계** | **' + st.logTotal + '** |\n\n';
  md += '- 지원받은 학생 수(실인원): ' + st.served + '명\n';
  md += '- 위기 징후 체크리스트 실시: ' + st.scrCount + '건\n';
  md += '- 지원팀 협의회 개최: ' + st.meetCount + '회\n\n';
  md += '※ 학생맞춤통합지원 업무 도우미에서 자동 집계한 자료입니다. 공식 보고 전 원자료와 대조해 주세요.\n';
  lastStatsMd = md;

  const tsvRows = [['구분', '항목', '값']];
  tsvRows.push(['사례 현황', '기간 내 신규 등록', st.opened.length]);
  tsvRows.push(['사례 현황', '기간 내 종결', st.closed.length]);
  tsvRows.push(['사례 현황', '기간 말 진행 중', st.activeAtEnd.length]);
  tsvRows.push(['사례 현황', '기간 중 관리 사례', st.managed.length]);
  LEVELS.forEach(lv => tsvRows.push(['위기 수준(진행 중)', lv, st.levelCount[lv]]));
  Object.keys(st.areaCount).forEach(a => { if (st.areaCount[a] > 0) tsvRows.push(['위기 영역', a, st.areaCount[a]]); });
  Object.keys(st.logType).forEach(t => { if (st.logType[t] > 0) tsvRows.push(['지원 활동', t, st.logType[t]]); });
  tsvRows.push(['지원 활동', '합계', st.logTotal]);
  tsvRows.push(['지원 활동', '지원 학생 수(실인원)', st.served]);
  tsvRows.push(['기타', '체크리스트 실시', st.scrCount]);
  tsvRows.push(['기타', '협의회 개최', st.meetCount]);
  lastStatsTsv = toTsv(tsvRows);

  const el = document.getElementById('stats-result');
  el.innerHTML = '<div class="cards" style="margin-bottom:12px;">' +
    '<div class="stat-card"><div class="num">' + st.opened.length + '</div><div class="lbl">신규 발굴</div></div>' +
    '<div class="stat-card green"><div class="num">' + st.closed.length + '</div><div class="lbl">종결</div></div>' +
    '<div class="stat-card"><div class="num">' + st.activeAtEnd.length + '</div><div class="lbl">진행 중</div></div>' +
    '<div class="stat-card amber"><div class="num">' + st.logTotal + '</div><div class="lbl">지원 활동(건)</div></div>' +
    '<div class="stat-card"><div class="num">' + st.meetCount + '</div><div class="lbl">협의회(회)</div></div>' +
    '</div>' +
    '<div class="btn-row">' +
    '<button class="btn" onclick="copyStatsMd()">보고서 복사 (마크다운)</button>' +
    '<button class="btn sub" onclick="downloadStatsMd()">보고서 파일 저장 (.md)</button>' +
    '<button class="btn sub" onclick="downloadStatsTsv()">집계표 저장 (.tsv — 엑셀용)</button></div>' +
    '<div class="mono-block">' + esc(md) + '</div>';
}

function saveSettings() {

function downloadBackup() {
  download('학생맞춤통합지원_백업_' + today() + '.json', JSON.stringify(state, null, 2), 'application/json;charset=utf-8');
}
function importBackup(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.students)) throw new Error('형식이 올바르지 않습니다.');
      if (!confirm('현재 데이터를 백업 파일 내용으로 교체합니다. (학생 ' + d.students.length + '명)\n계속할까요?')) { input.value = ''; return; }
      localStorage.setItem(STORE_KEY, JSON.stringify(d));
      state = load();
      save();
      render();
      alert('복원되었습니다.');
    } catch (e) { alert('복원 실패: ' + e.message); }
    input.value = '';
  };
  reader.readAsText(f, 'utf-8');
}
function exportStudentsTsv() {

  state.students.forEach(s => rows.push([
    s.code, s.name, s.grade, s.klass, s.num, s.homeroom, s.manager, s.referralPath,
    (s.areas || []).join(', '), s.level, s.stage, s.openedAt, s.closedAt || '',
    (s.consent && s.consent.collected) ? 'Y' : 'N', (s.consent && s.consent.date) || '', s.summary,
  ]));
  download('학생사례_' + today() + '.tsv', toTsv(rows), 'text/tab-separated-values;charset=utf-8');
}

  state.students.forEach(s => (s.logs || []).forEach(l => rows.push([

function screeningDocHtml(title, dateStr, checkedIds, memo, studentHtml) {
  const areas = screeningAreas(checkedIds);

      if (checkedIds.indexOf(it.id) >= 0) {
        rows += '<tr><td>' + esc(g.area) + '</td><td>' + esc(it.text) + (it.alert ? ' <b>(즉시 대응)</b>' : '') + '</td></tr>';

    '<table><tr><th style="width:110px;">실시일</th><td>' + esc(dateStr) + '</td><th style="width:110px;">체크 문항</th><td>' + checkedIds.length + '개</td></tr>' +
